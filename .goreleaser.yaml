version: 2

project_name: jaiscloud

before:
  hooks:
    - go mod tidy

# ── ACTIVE BUILDS ──────────────────────────────────────────────────────────
# Only jaiscloud-aws is released. Azure and GCP are future; add a build entry
# for each once those clouds have implementations beyond the 501 stub.

builds:
  - id: jaiscloud-aws
    main: ./cmd/jaiscloud-aws/
    binary: jaiscloud-aws
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# ── FUTURE BUILDS (not active) ─────────────────────────────────────────────
# Uncomment and add the matching archives/nfpms/brews/scoops entries when
# jaiscloud-azure and jaiscloud-gcp move past the 501-stub phase.
#
#  - id: jaiscloud-azure
#    main: ./cmd/jaiscloud-azure/
#    binary: jaiscloud-azure
#    env:
#      - CGO_ENABLED=0
#    goos: [linux, darwin, windows]
#    goarch: [amd64, arm64]
#    ldflags:
#      - -s -w
#      - -X main.version={{.Version}}
#      - -X main.commit={{.Commit}}
#      - -X main.date={{.Date}}
#
#  - id: jaiscloud-gcp
#    main: ./cmd/jaiscloud-gcp/
#    binary: jaiscloud-gcp
#    env:
#      - CGO_ENABLED=0
#    goos: [linux, darwin, windows]
#    goarch: [amd64, arm64]
#    ldflags:
#      - -s -w
#      - -X main.version={{.Version}}
#      - -X main.commit={{.Commit}}
#      - -X main.date={{.Date}}

archives:
  - id: aws
    ids: [jaiscloud-aws]
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "jaiscloud-aws_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # Future: uncomment when Azure/GCP builds are active
  # - id: azure
  #   ids: [jaiscloud-azure]
  #   formats: [tar.gz]
  #   format_overrides:
  #     - goos: windows
  #       formats: [zip]
  #   name_template: "jaiscloud-azure_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  #
  # - id: gcp
  #   ids: [jaiscloud-gcp]
  #   formats: [tar.gz]
  #   format_overrides:
  #     - goos: windows
  #       formats: [zip]
  #   name_template: "jaiscloud-gcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: aws-packages
    ids: [jaiscloud-aws]
    package_name: jaiscloud-aws
    vendor: JaisCloud
    homepage: https://github.com/jaisrajms/jaiscloud
    maintainer: "Raj Jaiswal jaisraj@gmail.com"
    description: "Local AWS cloud emulator — AWS wire-protocol compatible"
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

  # Future: jaiscloud-azure and jaiscloud-gcp nfpm entries go here

brews:
  - ids: [aws]
    name: jaiscloud-aws
    repository:
      owner: jaisrajms
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/jaisrajms/jaiscloud
    description: "Local AWS cloud emulator — AWS wire-protocol compatible"
    license: Apache-2.0

  # Future: add brews entries for jaiscloud-azure and jaiscloud-gcp

scoops:
  - ids: [aws]
    name: jaiscloud-aws
    repository:
      owner: jaisrajms
      name: scoop-jaiscloud
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/jaisrajms/jaiscloud
    description: "Local AWS cloud emulator — AWS wire-protocol compatible"
    license: Apache-2.0

  # Future: add scoops entries for jaiscloud-azure and jaiscloud-gcp

# ── DOCKER IMAGES ──────────────────────────────────────────────────────────────
# Builds per-arch images then combines them into a multi-arch manifest on Docker Hub.
# Requires DOCKERHUB_USERNAME env var (set in release.yml) and prior `docker login`.
dockers:
  - id: jaiscloud-aws-amd64
    ids: [jaiscloud-aws]
    goos: linux
    goarch: amd64
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:{{ .Version }}-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=jaiscloud-aws"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.source=https://github.com/jaisrajms/jaiscloud"

  - id: jaiscloud-aws-arm64
    ids: [jaiscloud-aws]
    goos: linux
    goarch: arm64
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:{{ .Version }}-arm64"
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=jaiscloud-aws"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.source=https://github.com/jaisrajms/jaiscloud"

docker_manifests:
  - name_template: "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:{{ .Version }}"
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:{{ .Version }}-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:{{ .Version }}-arm64"

  # TODO: once out of alpha, guard this with skip_push: "{{ if .Prerelease }}true{{ end }}"
  # so that rc/alpha/beta tags no longer overwrite latest on Docker Hub.
  # For now we intentionally push latest on every release including prereleases.
  - name_template: "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:latest"
    image_templates:
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:latest-amd64"
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws:latest-arm64"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: jaisrajms
    name: jaiscloud
  draft: false
  prerelease: auto
