version: 2

project_name: jaiscloud

before:
  hooks:
    - go mod tidy

# ── ACTIVE BUILDS ──────────────────────────────────────────────────────────
# Only jaiscloud-aws is released. Azure and GCP are future; add a build entry
# for each once those clouds have implementations beyond the 501 stub.

builds:
  - id: jaiscloud-aws
    main: ./cmd/jaiscloud-aws/
    binary: jaiscloud-aws
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

# ── FUTURE BUILDS (not active) ─────────────────────────────────────────────
# Uncomment and add the matching archives/nfpms/brews/scoops entries when
# jaiscloud-azure and jaiscloud-gcp move past the 501-stub phase.
#
#  - id: jaiscloud-azure
#    main: ./cmd/jaiscloud-azure/
#    binary: jaiscloud-azure
#    env:
#      - CGO_ENABLED=0
#    goos: [linux, darwin, windows]
#    goarch: [amd64, arm64]
#    ldflags:
#      - -s -w
#      - -X main.version={{.Version}}
#      - -X main.commit={{.Commit}}
#      - -X main.date={{.Date}}
#
#  - id: jaiscloud-gcp
#    main: ./cmd/jaiscloud-gcp/
#    binary: jaiscloud-gcp
#    env:
#      - CGO_ENABLED=0
#    goos: [linux, darwin, windows]
#    goarch: [amd64, arm64]
#    ldflags:
#      - -s -w
#      - -X main.version={{.Version}}
#      - -X main.commit={{.Commit}}
#      - -X main.date={{.Date}}

archives:
  - id: aws
    ids: [jaiscloud-aws]
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "jaiscloud-aws_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  # Future: uncomment when Azure/GCP builds are active
  # - id: azure
  #   ids: [jaiscloud-azure]
  #   formats: [tar.gz]
  #   format_overrides:
  #     - goos: windows
  #       formats: [zip]
  #   name_template: "jaiscloud-azure_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  #
  # - id: gcp
  #   ids: [jaiscloud-gcp]
  #   formats: [tar.gz]
  #   format_overrides:
  #     - goos: windows
  #       formats: [zip]
  #   name_template: "jaiscloud-gcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: aws-packages
    ids: [jaiscloud-aws]
    package_name: jaiscloud-aws
    vendor: JaisCloud
    homepage: https://github.com/jaisrajms/jaiscloud
    maintainer: "Raj Jaiswal jaisraj@gmail.com"
    description: "Local AWS cloud emulator — AWS wire-protocol compatible"
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

  # Future: jaiscloud-azure and jaiscloud-gcp nfpm entries go here

homebrew_casks:
  - ids: [aws]
    name: jaiscloud-aws
    repository:
      owner: jaisrajms
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/jaisrajms/jaiscloud
    description: "Local AWS cloud emulator — AWS wire-protocol compatible"
    license: Apache-2.0

  # Future: add homebrew_casks entries for jaiscloud-azure and jaiscloud-gcp

scoops:
  - ids: [aws]
    name: jaiscloud-aws
    repository:
      owner: jaisrajms
      name: scoop-jaiscloud
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/jaisrajms/jaiscloud
    description: "Local AWS cloud emulator — AWS wire-protocol compatible"
    license: Apache-2.0

  # Future: add scoops entries for jaiscloud-azure and jaiscloud-gcp

# ── DOCKER IMAGES ──────────────────────────────────────────────────────────────
# Single dockers_v2 entry replaces the old dockers + docker_manifests pair.
# Buildx handles linux/amd64 and linux/arm64 in one shot via the multi-stage Dockerfile.
# Requires DOCKERHUB_USERNAME env var (set in release.yml) and prior `docker login`.
# TODO: once out of alpha, remove "latest" tag for prereleases by changing it to:
#   "{{ if not .Prerelease }}latest{{ end }}"
dockers_v2:
  - images:
      - "{{ .Env.DOCKERHUB_USERNAME }}/jaiscloud-aws"
    tags:
      - "{{ .Version }}"
      - "latest"
    dockerfile: Dockerfile.goreleaser
    labels:
      "org.opencontainers.image.title": "jaiscloud-aws"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .Commit }}"
      "org.opencontainers.image.source": "https://github.com/jaisrajms/jaiscloud"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: jaisrajms
    name: jaiscloud
  draft: false
  prerelease: auto
