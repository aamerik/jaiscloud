# Behavioural depth record - container (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: container
classes:
  p2:
    state: exempt
    reason: "no concurrency/contention suite over clusters or node pools"
    date: "2026-10-13"
  p3:
    state: present
    suites: [sdk-container]
    note: "googleapi error codes on cluster/node-pool RPCs"
  p4:
    state: exempt
    reason: "no pageToken paging over clusters / node pools"
    date: "2026-10-13"
  p5:
    state: exempt
    reason: "no scale/boundary suite"
    date: "2026-10-13"
