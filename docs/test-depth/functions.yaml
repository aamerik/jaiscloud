# Behavioural depth record - functions (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: functions
classes:
  p2:
    state: exempt
    reason: "no concurrent/contention suite over the control plane"
    date: "2026-10-13"
  p3:
    state: exempt
    reason: "no error-envelope suite on the official-client path (raw-REST tests excluded by the DoD)"
    date: "2026-10-13"
  p4:
    state: exempt
    reason: "no pageToken paging over functions"
    date: "2026-10-13"
  p5:
    state: exempt
    reason: "no large/streaming or revision-lineage boundary suite"
    date: "2026-10-13"
