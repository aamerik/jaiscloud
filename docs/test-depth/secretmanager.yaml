# Behavioural depth record - secretmanager (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: secretmanager
classes:
  p2:
    state: exempt
    reason: "no concurrent version-add/disable contention suite"
    date: "2026-10-13"
  p3:
    state: present
    suites: [sdk-rest]
    note: "delete-of-missing 404 and IAM error envelopes"
  p4:
    state: exempt
    reason: "no pageToken paging over secrets / versions"
    date: "2026-10-13"
  p5:
    state: present
    suites: [sdk-rest]
    note: "version rotation and scheduled-destroy retention"
