# Behavioural depth record - metastore (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: metastore
classes:
  p2:
    state: exempt
    reason: "no concurrent-DDL suite over one service"
    owner: TD8
    date: "2026-10-13"
  p3:
    state: present
    suites: [sdk-metastore]
    note: "declared HMS error envelopes on bad input"
  p4:
    state: exempt
    reason: "no partition/service/backup listing+paging suite"
    owner: TD8
    date: "2026-10-13"
  p5:
    state: exempt
    reason: "no large-schema/partition-count boundary suite"
    owner: TD8
    date: "2026-10-13"
