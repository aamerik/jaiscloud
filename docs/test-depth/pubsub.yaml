# Behavioural depth record - pubsub (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: pubsub
classes:
  p2:
    state: present
    suites: [sdk-pubsub]
    note: "exactly-once ack IDs, ack-deadline redelivery, ordering-key contention"
  p3:
    state: present
    suites: [sdk-rest]
    note: "delete-of-missing 404 and dead-letter envelopes"
  p4:
    state: exempt
    reason: "no pageToken paging assertion over topic/subscription listings"
    date: "2026-10-13"
  p5:
    state: present
    suites: [sdk-pubsub]
    note: "retention + snapshot/seek, streaming pull, DLQ fan-out"
