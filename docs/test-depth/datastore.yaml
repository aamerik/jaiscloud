# Behavioural depth record - datastore (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: datastore
classes:
  p2:
    state: present
    suites: [sdk-datastore]
    note: "transaction conflict aborts (no lost update)"
  p3:
    state: exempt
    reason: "no explicit error-envelope assertion in the official-client suite yet"
    date: "2026-10-13"
  p4:
    state: present
    suites: [sdk-datastore]
    note: "cursor paging (Limit + MORE_RESULTS_AFTER_LIMIT + resume)"
  p5:
    state: present
    suites: [sdk-datastore]
    note: "batch GetMulti/PutMulti multi-entity boundary"
