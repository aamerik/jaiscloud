# Behavioural depth record - iam (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: iam
classes:
  p2:
    state: exempt
    reason: "authz is not enforced; no concurrent-mutation contention suite"
    date: "2026-10-13"
  p3:
    state: present
    suites: [sdk-rest]
    note: "invalid-create / not-found service-account envelopes"
  p4:
    state: exempt
    reason: "no pageToken paging over service accounts / keys"
    date: "2026-10-13"
  p5:
    state: exempt
    reason: "no version/rotation lineage surface to exercise"
    date: "2026-10-13"
