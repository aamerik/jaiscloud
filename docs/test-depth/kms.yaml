# Behavioural depth record - kms (TD1).
#
# p2-p5 are defined in docs/GCP-TESTABILITY.md §10. Each class is either
# `present` (asserted by the official-client suite(s) listed) or `exempt`
# (reasoned + dated). `make gcp-status-depth-gate` fails when a `ga` service
# has no record here or leaves a class unaccounted for.
service: kms
classes:
  p2:
    state: exempt
    reason: "no concurrent destroy/rotation contention suite"
    date: "2026-10-13"
  p3:
    state: present
    suites: [sdk-rest]
    note: "key-version destroy / not-found envelopes"
  p4:
    state: exempt
    reason: "no pageToken paging over key rings / crypto key versions"
    date: "2026-10-13"
  p5:
    state: present
    suites: [sdk-rest]
    note: "key-version rotation and scheduled-destroy lineage"
