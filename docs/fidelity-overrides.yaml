    allow_upgrade: true
    reason: "covered by the official admin-client gRPC conformance suite"
  - service: firestoreadmin
    operation: GetIndex
    state: ga
    allow_upgrade: true
    reason: "covered by the official admin-client gRPC conformance suite"
  - service: firestoreadmin
    operation: ListIndexes
