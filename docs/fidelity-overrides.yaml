# Curated fidelity overrides for the GCP emulator — the published contract.
#
# tools/fidelitygen merges these over the state it derives from the emulator's
# registries and wire-conformance evidence. Overrides may only DOWNGRADE a cell
# unless `allow_upgrade: true` is set.
#
# Rules enforced by the generator (it fails on violation):
#   - every service / operation must exist in the enumerated registry;
#   - `state` must be one of: ga | limited | preview | unsupported;
#   - any non-`ga` state MUST carry a `reason`;
#   - any `ga` override MUST set `allow_upgrade: true`.

# Applied to every operation of a service unless overridden per-operation.
defaults:
  bigquery:
    state: preview
    reason: "no SQL engine; metadata + stored rows only"
  cloudsql:
    state: limited
    reason: "metadata-only over ResourceStore (no control plane)"
  compute:
    state: limited
    reason: "metadata-only over ResourceStore (no control plane)"
  clouddns:
    state: limited
    reason: "metadata-only over ResourceStore (no private DNS resolution)"
  memorystore:
    state: limited
    reason: "metadata-only over ResourceStore (no data plane)"
  iceberg:
    state: preview
    reason: "BigLake Iceberg REST catalog; no official Discovery document"

operations:
  - service: dataproc
    operation: Dataproc.SubmitJob
    state: ga
    allow_upgrade: true
    reason: "covered by the k3d Lakehouse e2e (real Spark on Kubernetes)"

  # Explicit Unimplemented stubs: enumerated but not implemented.
  - service: clouddns
    operation: CloudDNS.Unimplemented
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: cloudsql
    operation: CloudSQL.Unimplemented
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: compute
    operation: Compute.Unimplemented
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.ExportMetadata
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.RestoreService
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.QueryMetadata
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.MoveTableToDatabase
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: metastore
    operation: Metastore.AlterMetadataResourceLocation
    state: unsupported
    reason: "explicit Unimplemented stub"
  - service: dataproc
    operation: Dataproc.DiagnoseCluster
    state: unsupported
    reason: "explicit Unimplemented stub"
  # gRPC DiagnoseCluster is the same explicit Unimplemented stub over the
  # ClusterController surface (the descriptor name carries no "Dataproc." prefix).
  - service: dataproc
    operation: DiagnoseCluster
    state: unsupported
    reason: "explicit Unimplemented stub"
  # Cloud Functions gRPC is control-plane only: v1 CallFunction is runtime
  # invocation and v2 ListRuntimes has no emulator implementation, so both are
  # explicit Unimplemented stubs (the REST surface does implement CallFunction).
  - service: functions
    operation: CallFunction
    state: unsupported
    reason: "runtime invocation is out of scope for the gRPC control plane; explicit Unimplemented stub"
  - service: functions
    operation: ListRuntimes
    state: unsupported
    reason: "not served by the emulator (the REST surface does not implement it either); explicit Unimplemented stub"
  # Service Usage gRPC is control-plane only: the service/get/list/enable/disable
  # surface is implemented, while BatchGetServices is an explicit Unimplemented
  # stub (the REST surface does not implement it either).
  - service: serviceusage
    operation: BatchGetServices
    state: unsupported
    reason: "not served by the emulator (the REST surface does not implement it either); explicit Unimplemented stub"
  # Cloud Workflows gRPC is control-plane only: ListWorkflowRevisions has no
  # emulator implementation (workflow revision history is not modelled), so it
  # is an explicit Unimplemented stub.
  - service: workflows
    operation: ListWorkflowRevisions
    state: unsupported
    reason: "workflow revision history is not modelled; explicit Unimplemented stub"
  # Cloud Resource Manager v3 gRPC is control-plane only: GetProject and the
  # project IAM methods are implemented, while the project lifecycle/lookup RPCs
  # are explicit Unimplemented stubs. The emulator never creates, moves, or
  # deletes projects (every project id resolves to a synthesized ACTIVE
  # project), and the v1 REST surface does not implement them either.
  - service: resourcemanager
    operation: ListProjects
    state: unsupported
    reason: "projects are synthesized, never created; explicit Unimplemented stub"
  - service: resourcemanager
    operation: SearchProjects
    state: unsupported
    reason: "projects are synthesized, never created; explicit Unimplemented stub"
  - service: resourcemanager
    operation: CreateProject
    state: unsupported
    reason: "projects are synthesized, never created; explicit Unimplemented stub"
  - service: resourcemanager
    operation: UpdateProject
    state: unsupported
    reason: "project metadata is not modelled; explicit Unimplemented stub"
  - service: resourcemanager
    operation: MoveProject
    state: unsupported
    reason: "project parent/ancestry is not modelled; explicit Unimplemented stub"
  - service: resourcemanager
    operation: DeleteProject
    state: unsupported
    reason: "projects are synthesized, never deleted; explicit Unimplemented stub"
  - service: resourcemanager
    operation: UndeleteProject
    state: unsupported
    reason: "projects are synthesized, never deleted; explicit Unimplemented stub"
  - service: managedkafka
    operation: ManagedKafka.GetConsumerGroup
    state: limited
    reason: "no broker data plane; consumer groups are never present, so get returns NOT_FOUND"
  - service: managedkafka
    operation: ManagedKafka.UpdateConsumerGroup
    state: limited
    reason: "no broker data plane; consumer groups are never present, so update returns NOT_FOUND"
  - service: managedkafka
    operation: ManagedKafka.DeleteConsumerGroup
    state: limited
    reason: "no broker data plane; consumer groups are never present, so delete returns NOT_FOUND"

  # REST operations deliberately left limited: implemented to the extent the
  # emulator models the subsystem, with the missing plane named in the reason.
  - service: managedkafka
    operation: ManagedKafka.ListConsumerGroups
    state: limited
    reason: "no broker data plane; consumer-group listing returns an empty set"
  - service: managedkafka
    operation: ManagedKafka.GetOperation
    state: limited
    reason: "the locations/{location}/operations path is shared with Cloud Workflows and routes to workflows on the single emulator host; the handler is reachable only by direct dispatch (mutations return operations inline done:true)"
  - service: managedkafka
    operation: ManagedKafka.ListOperations
    state: limited
    reason: "the locations/{location}/operations path is shared with Cloud Workflows and routes to workflows on the single emulator host; the handler is reachable only by direct dispatch (mutations return operations inline done:true)"

  # gRPC consumer-group methods are limited for the same reason as their REST
  # counterparts: the emulator has no broker, so a list is always empty and the
  # item methods report NOT_FOUND.
  - service: managedkafka
    operation: ListConsumerGroups
    state: limited
    reason: "no broker data plane; consumer-group listing returns an empty set"
  - service: managedkafka
    operation: GetConsumerGroup
    state: limited
    reason: "no broker data plane; consumer groups are never present, so get returns NOT_FOUND"
  - service: managedkafka
    operation: UpdateConsumerGroup
    state: limited
    reason: "no broker data plane; consumer groups are never present, so update returns NOT_FOUND"
  - service: managedkafka
    operation: DeleteConsumerGroup
    state: limited
    reason: "no broker data plane; consumer groups are never present, so delete returns NOT_FOUND"

  # gRPC methods deliberately left limited: each is gated on a subsystem the
  # emulator does not model, so implementing it would fabricate a wire-divergent
  # result. They fail loudly with codes.Unimplemented rather than silently
  # succeeding.
  - service: kms
    operation: ImportCryptoKeyVersion
    state: limited
    reason: "key import needs a store path to create a version from caller-supplied material plus RSA-OAEP + AES-KWP (RFC 5649) unwrapping"
  - service: kms
    operation: ImportTrustedKeyWrappedCryptoKeyVersion
    state: limited
    reason: "HSM trusted key wrapping (preview/EKM, AES-256-KWP) is not modelled"
  - service: kms
    operation: ExportTrustedKeyWrappedCryptoKeyVersion
    state: limited
    reason: "HSM trusted key wrapping (preview/EKM, AES-256-KWP) is not modelled"
  - service: kms
    operation: Decapsulate
    state: limited
    reason: "KEM decapsulation needs a KEM key type (ML-KEM/X-Wing) and raw-bytes public keys the emulator does not generate"
  - service: secretmanager
    operation: RotateSecret
    state: limited
    reason: "the proto rotates the secret and updates a linked Cloud SQL password; the emulator has no Cloud SQL data plane"
  - service: secretmanager
    operation: EnableManagedRotation
    state: limited
    reason: "managed rotation needs a rotation Cloud Function and config the emulator does not model"
  - service: logging
    operation: TailLogEntries
    state: limited
    reason: "bounded store-poll tail whose latency derives from buffer_window; no deterministic conformance assertion exists"
  - service: storage
    operation: BidiReadObject
    state: limited
    reason: "bidirectional streaming read with range handles is unimplemented; only the server-streaming ReadObject is served"
