  # Cloud Functions v2 ListRuntimes is implemented over the shared runtime
  # catalog on both transports (REST GET /v2/.../runtimes + gRPC ListRuntimes),
  # verified by the official gRPC client conformance suite, so it needs no
  # override.
  #
  # Cloud Functions REST common-API methods: GetLocation is the shared
  # google.cloud.location.Locations method and CancelOperation/DeleteOperation/
  # WaitOperation are the shared google.longrunning.Operations methods (the Cloud
  # Functions RPC reference lists both interfaces). The service Discovery
  # document deliberately does not enumerate common-API methods, so the
  # classifier reports these as limited ("no matching Discovery method") even
  # though the handlers are served and wire-tested (DELETE /v2/.../operations/{id},
  # POST /v2/.../operations/{id}:cancel, POST /v2/.../operations/{id}:wait,
  # GET /v1/projects/{p}/locations/{l}); the cells are therefore upgraded to ga.
  # WaitOperation is gRPC-only in the canonical proto (no HTTP annotation); REST
  # :wait is an emulator extension, kept for symmetry with the other LRO verbs.
  - service: functions
    operation: Function.GetLocation
    state: ga
    allow_upgrade: true
    reason: "shared google.cloud.location.Locations.GetLocation common API; not enumerated in the service Discovery document, but served (GET /v1/projects/{p}/locations/{l}) and wire-tested"
  - service: functions
    operation: Function.CancelOperation
    state: ga
    allow_upgrade: true
    reason: "shared google.longrunning.Operations.CancelOperation common API; not enumerated in the service Discovery document, but served (POST /v2/projects/{p}/locations/{l}/operations/{id}:cancel) and wire-tested"
  - service: functions
    operation: Function.DeleteOperation
    state: ga
    allow_upgrade: true
    reason: "shared google.longrunning.Operations.DeleteOperation common API; not enumerated in the service Discovery document, but served (DELETE /v2/projects/{p}/locations/{l}/operations/{id}) and wire-tested"
  - service: functions
    operation: Function.WaitOperation
    state: ga
    allow_upgrade: true
    reason: "google.longrunning.Operations.WaitOperation common API (gRPC-only in the canonical proto — no HTTP annotation); the emulator additionally serves it at POST /v2/projects/{p}/locations/{l}/operations/{id}:wait and wire-tests it"
  # A deployed function's HTTPS-trigger URL is a data-plane endpoint, not a
  # Discovery method: the client addresses it at the synthesized host
  # "{location}-{project}.cloudfunctions.net/{functionId}", so there is no
  # service method to enumerate. The endpoint is served and wire-tested, hence
  # ga.
  - service: functions
    operation: Function.InvokeTrigger
    state: ga
    allow_upgrade: true
    reason: "deployed function's HTTPS-trigger URL (a function URL host, not a Discovery method); served at {location}-{project}.cloudfunctions.net/{functionId} and wire-tested"
  # Cloud Run REST common-API / data-plane methods. The run v2 Discovery document
  # enumerates operations.get/list/delete/wait but not :cancel, and has no
  # `invoke` method at all, so the classifier reports both as limited ("no
  # matching Discovery method"). The handlers are served and wire/unit-tested, so
  # the cells are upgraded to ga.
  - service: run
    operation: Run.CancelOperation
    state: ga
    allow_upgrade: true
    reason: "shared google.longrunning.Operations.CancelOperation common API; not enumerated in the run v2 Discovery document (operations.get/list/delete/wait only), but served (POST /v2/projects/{p}/locations/{l}/operations/{id}:cancel) and wire-tested"
  - service: run
    operation: Run.Invoke
    state: ga
    allow_upgrade: true
    reason: "Cloud Run data-plane invocation (the synthesized {service}-{token}.{location}.run.app host, or the legacy /run/v2/.../services/{svc}/<subpath> path form), not a Discovery method; served by the InvocationCodec/runtime seam and wire/unit-tested (mock resolves 503, the docker/k8s executor proxies to the revision)"
  # Cloud Workflows gRPC is control-plane only: ListWorkflowRevisions has no
  # emulator implementation (workflow revision history is not modelled), so it
  # is an explicit Unimplemented stub.
  - service: workflows
    operation: ListWorkflowRevisions
    state: unsupported
    reason: "workflow revision history is not modelled; explicit Unimplemented stub"
  # Cloud Resource Manager v3 gRPC serves the whole Projects surface — the
  # lifecycle (GetProject / CreateProject / ListProjects / DeleteProject /
  # UndeleteProject), project administration (SearchProjects / UpdateProject /
  # MoveProject) and the project IAM methods — over one core shared with the
  # legacy v1 REST surface. The parent reference (org/folder), mutable metadata
  # (display name, labels) and the search query grammar are modelled, so no
  # overrides are needed.
  # Managed Kafka and Dataproc Metastore Get/ListOperations are `ga`: their own
  # host token (managedkafka.localhost / metastore.localhost, or the canonical
  # *.googleapis.com host) routes the shared locations/{location}/operations
  # family to the owning service, so the handlers are reachable under each
  # service's canonical endpoint (not only by direct dispatch); the default host
  # keeps that path on Cloud Workflows.

  # Dataproc Metastore gRPC is control-plane only: the deferred control-plane
  # RPCs (export/restore/query/move/alter) are gated on a Hive Thrift data plane
  # the emulator does not model per service, so each is an explicit
  # Unimplemented stub.
  - service: metastore
