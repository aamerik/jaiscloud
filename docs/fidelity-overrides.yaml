# Curated fidelity overrides for the GCP emulator — the published contract.
#
# tools/fidelitygen merges these over the state it derives from the emulator's
# registries and wire-conformance evidence. Overrides may only DOWNGRADE a cell
# unless `allow_upgrade: true` is set.
#
# Rules enforced by the generator (it fails on violation):
#   - every service / operation must exist in the enumerated registry;
#   - `state` must be one of: ga | limited | preview | unsupported;
#   - any non-`ga` state MUST carry a `reason`;
#   - any `ga` override MUST set `allow_upgrade: true`.

# Applied to every operation of a service unless overridden per-operation.
defaults:
  bigquery:
    state: limited
    reason: "documented Standard SQL subset (one pure-Go SQLite engine in both memory and --dsn modes, docs/gcp-bigquery-sql-engine.md §5); DDL/DML jobs complete synchronously and paging/getQueryResults snapshot semantics are simplified; load jobs cover one or more gs:// objects (including a single-'*' wildcard) or an uploaded file (multipart / resumable media session) of NEWLINE_DELIMITED_JSON, CSV, Parquet or Avro, with a supplied schema, an embedded file schema, or autodetect; gzip-compressed CSV/JSON is auto-detected; useAvroLogicalTypes selects logical vs raw Avro types (ORC, Parquet/Avro map/decimal shapes, and Avro unions with more than one non-null type fail loud)"
  cloudsql:
    state: limited
    reason: "metadata-only over ResourceStore (no control plane)"
  compute:
    state: limited
    reason: "metadata-only over ResourceStore (no control plane)"
  clouddns:
    state: limited
    reason: "metadata-only over ResourceStore (no private DNS resolution)"
  memorystore:
    state: limited
    reason: "metadata-only over ResourceStore (no data plane)"
  iceberg:
    state: preview
    reason: "BigLake Iceberg REST catalog; no official Discovery document"
  # Firestore Admin gRPC: only composite-index CRUD is implemented; every other
  # RPC (Databases, Backups, User Creds, Schedules, Fields, Export/Import) is
  # inherited from UnimplementedFirestoreAdminServer and fails loud.
  firestoreadmin:
    state: unsupported
    reason: "explicit Unimplemented stub (no Admin surface beyond composite-index CRUD)"

operations:
  - service: dataproc
    operation: Dataproc.SubmitJob
    state: ga
    allow_upgrade: true
    reason: "covered by the k3d Lakehouse e2e (real Spark on Kubernetes, GKE virtualClusterConfig + driver output in GCS)"

  # Firestore Admin composite-index CRUD: verified end-to-end by the official
  # cloud.google.com/go/firestore/apiv1/admin client conformance suite.
  - service: firestoreadmin
    operation: CreateIndex
