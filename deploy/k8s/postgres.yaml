---
# PersistentVolumeClaim — postgres data survives pod restarts
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: jaiscloud
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
# Secret — postgres credentials
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: jaiscloud
type: Opaque
stringData:
  POSTGRES_USER: jaiscloud
  POSTGRES_PASSWORD: jaiscloud
  POSTGRES_DB: jaiscloud
  dsn: "postgresql://jaiscloud:jaiscloud@postgres.jaiscloud.svc.cluster.local:5432/jaiscloud"
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jaiscloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, jaiscloud]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# ClusterIP Service — reachable inside the cluster
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jaiscloud
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# NodePort Service — exposes postgres for local tooling (e.g. psql, migrations)
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: jaiscloud
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30543
