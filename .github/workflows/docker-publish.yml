name: Build and Publish Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ─── Resolve version once, share across the matrix ─────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

  # ─── Build and push all three images in parallel ───────────────────────────
  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lite: CGO_ENABLED=0, scratch base — supports all three platforms.
          - image: jaiscloud-lite
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64,linux/arm/v7

          # Full: CGO_ENABLED=1, debian base + bundled aws-emr-spark plugin.
          # arm/v7 dropped — 32-bit CGO plugin loading is not supported.
          - image: jaiscloud-full
            dockerfile: Dockerfile.full
            platforms: linux/amd64,linux/arm64

          # SDK: golang:1.26 builder image for compiling custom plugins.
          - image: jaiscloud-sdk
            dockerfile: Dockerfile.sdk
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Checkout (full history for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          build-args: VERSION=${{ needs.setup.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.setup.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
